<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Detective｜Unit 3 Reading</title><style>
:root{--ink:#463555;--plum:#684a8d;--pink:#ffe0e8;--blue:#e1f3ff;--yellow:#fff0bc;--mint:#def6e9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 8%,#ffdfd1 0,transparent 33%),radial-gradient(circle at 92% 18%,#dfebff 0,transparent 32%),#fff8eb;color:var(--ink);font-family:'Trebuchet MS','Noto Sans TC','Microsoft JhengHei',sans-serif}.app{max-width:1120px;margin:auto;padding:22px 18px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(27px,4vw,42px);font-weight:1000;color:#66418a;text-shadow:2px 2px #fff}.sub{font-size:13px;color:#826d87}.chip{padding:10px 14px;border-radius:30px;background:white;border:2px solid #eacfea;font-size:13px}.card{background:#fffdfa;border:3px solid #e7cde8;border-radius:26px;box-shadow:0 9px 0 #e6d6ed;padding:24px;margin-top:25px}.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.eyebrow{font-size:14px;font-weight:bold;color:#8b66a8;letter-spacing:.04em}.title{font-size:clamp(28px,5vw,42px);font-weight:900;margin:10px 0 18px;line-height:1.22}.hint{color:#88738d;margin:0 0 18px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:13px}.answer{min-height:88px;padding:17px;text-align:left;display:flex;gap:13px;align-items:center;font:inherit;font-weight:750;font-size:clamp(16px,2.2vw,21px);border:2px solid transparent;border-radius:17px;color:var(--ink);cursor:pointer;transition:transform .1s}.answer:hover:not(:disabled){transform:translateY(-3px)}.answer:disabled{cursor:default;opacity:.65}.answer.chosen{border:3px solid #70499b;opacity:1;box-shadow:inset 0 0 0 2px white}.letter{display:inline-grid;place-items:center;background:white;color:#624787;font-weight:900;min-width:40px;height:40px;border-radius:50%;font-size:20px}.a0{background:var(--pink)}.a1{background:var(--blue)}.a2{background:var(--mint)}.a3{background:var(--yellow)}.a4{background:#eadaff}.line{height:1px;background:#efe3ee;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button.small{border:0;border-radius:14px;padding:13px 19px;font:inherit;font-weight:750;background:#7352a0;color:white;cursor:pointer}button.small.secondary{background:#e7d9f4;color:#56386c}button.small:disabled{opacity:.5;cursor:default}.muted{color:#8c7990;font-size:14px}.bars{display:grid;gap:15px}.barlabel{display:flex;gap:10px;justify-content:space-between;font-size:16px;font-weight:bold}.track{height:20px;background:#f0eaf2;border-radius:20px;overflow:hidden;margin-top:7px}.fill{height:100%;background:#9e79c3;transition:width .4s}.teacher{margin-top:20px;padding:19px;background:#fff1dc;border:2px dashed #e9bc72;border-radius:20px}.mini{font-size:12px;color:#927b98}input{border:2px solid #d9c6e3;border-radius:10px;font:inherit;padding:10px}.status{font-size:14px;padding:10px 0}.hidden{display:none!important}@media(max-width:680px){.answers{grid-template-columns:1fr}.card{padding:18px}.answer{min-height:65px}}
</style></head><body><div class="app"><div class="head"><div><div class="brand">🌙 Dream Detective 🔍</div><div class="sub">Unit 3 Reading · The Dreamcatcher</div></div><div class="actions"><span class="chip" id="state">連線中…</span><button class="small secondary" id="login">Google 登入</button><button class="small secondary hidden" id="logout">登出</button></div></div><div class="card"><div class="top"><div class="eyebrow" id="category"></div><div class="chip" id="number"></div></div><div class="title" id="question">Loading…</div><div class="hint" id="hint"></div><div class="answers" id="answers"></div><div id="message" class="status"></div><div class="line"></div><div class="actions"><button class="small" id="resultsBtn">📊 顯示全班投票比例</button><span id="total" class="muted"></span></div><div class="bars hidden" id="results"></div></div><div id="teacher" class="teacher hidden"><strong>👩‍🏫 Teacher Controls</strong><p class="muted">老師控制全班正在回答的題目。切換題目不會公布答案。</p><div class="actions"><button class="small secondary" id="prev">← 上一題</button><button class="small" id="next">下一題 →</button><button class="small secondary" id="reset">清除本次全部投票</button><span id="teacherMsg" class="muted"></span></div></div><p class="mini" id="privacy">本活動只顯示班級投票比例，不顯示學生姓名或分數。</p></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,setDoc,collection,onSnapshot,getDocs,writeBatch,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig,teacherEmail} from './firebase-config.js';
const items=[{category:'DREAM WARM-UP',question:'Which dream did you have in the past?',hint:'Choose the dream you remember.',options:['My teeth fell out.','Something was chasing me.','I was falling.','I was late for school.','None of these.']},
{category:'DREAM DETECTIVE 1',question:'What does this dream mean?',hint:'Losing teeth',options:['You are hungry.','You are nervous.','You are happy.','You are tired.']},
{category:'DREAM DETECTIVE 2',question:'What does this dream mean?',hint:'Falling',options:['You are afraid of something.','You are losing something important.','You can’t control something.','You are worried about your future.']},
{category:'DREAM DETECTIVE 3',question:'What does this dream mean?',hint:'Being chased',options:['You are afraid of someone.','You are running away from a problem.','You are worried about your future.','You want to change your life.']},
{category:'DREAM DETECTIVE 4',question:'What does this dream mean?',hint:'Being trapped',options:['You feel lonely.','You want to be free.','Something is troubling you.','You have too much homework! 📚']},
{category:'LET’S CHECK!',question:'Do you agree?',hint:'Do you agree with the book’s dream meanings?',options:['Yes.','Maybe.','No.']},
{category:'READING CHALLENGE 1',question:'What did Emma dream about?',options:['A big dog and some candy.','A bear and falling teeth.','A new school and her friends.','A birthday cake and a cat.']},
{category:'READING CHALLENGE 2',question:'What was Emma doing when her teeth fell out?',options:['She was sleeping.','She was eating cake.','She was brushing her teeth.','She was running away.']},
{category:'READING CHALLENGE 3',question:'Why couldn’t Emma fall asleep again?',options:['She was hungry.','She was scared.','She was sick.','She was excited.']},
{category:'READING CHALLENGE 4',question:'Who gave Emma a dreamcatcher?',options:['Her mother.','Her father.','Her friend Dakota.','Her teacher.']},
{category:'READING CHALLENGE 5',question:'What does a dreamcatcher catch?',options:['Good dreams.','Bad dreams.','All dreams.','No dreams.']},
{category:'READING CHALLENGE 6',question:'Did the dreamcatcher work?',options:['Yes, it did.','No, it didn’t.','We don’t know.']}];
let auth,db,user=null,isTeacher=false,index=0,ballots=[],showResults=false,unsubscribeSession=()=>{},unsubscribeVotes=()=>{};
const configured=Boolean(firebaseConfig.apiKey&&firebaseConfig.projectId&&firebaseConfig.apiKey!=='PASTE_API_KEY');
const $=id=>document.getElementById(id),pollKey=()=>`q${index}`,localUser='local-device',getLocal=()=>JSON.parse(localStorage.getItem('dream_demo_votes')||'{}');
function display(){let q=items[index],myID=user?.uid||localUser; $('category').textContent=q.category;$('number').textContent=`${index+1} / ${items.length}`;$('question').textContent=q.question;$('hint').textContent=q.hint||'Choose the best answer.';const mine=ballots.find(b=>b.uid===myID);$('answers').replaceChildren();q.options.forEach((a,i)=>{const btn=document.createElement('button');btn.className=`answer a${i}${mine?.choice===i?' chosen':''}`;btn.disabled=!!mine || (configured&&!user);const c=document.createElement('span');c.className='letter';c.textContent=String.fromCharCode(65+i);const t=document.createElement('span');t.textContent=a;btn.append(c,t);btn.addEventListener('click',()=>vote(i));$('answers').append(btn)});$('message').textContent=mine?'✓ 已送出，謝謝你的參與！':configured&&!user?'請先使用 Google 登入。':'請選一個答案。';$('total').textContent=`共 ${ballots.length} 票`;$('teacher').classList.toggle('hidden',!isTeacher);$('results').classList.toggle('hidden',!showResults);renderBars();}
function renderBars(){let q=items[index],counts=q.options.map((_,i)=>ballots.filter(b=>b.choice===i).length);$('results').replaceChildren();q.options.forEach((a,i)=>{let row=document.createElement('div'),top=document.createElement('div'),span=document.createElement('span'),num=document.createElement('span'),track=document.createElement('div'),fill=document.createElement('div');top.className='barlabel';span.textContent=String.fromCharCode(65+i)+'. '+a;num.textContent=(ballots.length?Math.round(counts[i]/ballots.length*100):0)+'% ('+counts[i]+')';track.className='track';fill.className='fill';fill.style.width=(ballots.length?counts[i]/ballots.length*100:0)+'%';top.append(span,num);track.append(fill);row.append(top,track);$('results').append(row)})}
function localLoad(){let v=getLocal();index=Number(localStorage.getItem('dream_demo_index')||0);ballots=v[pollKey()]||[];display()}
async function vote(choice){if(ballots.some(b=>b.uid===(user?.uid||localUser)))return;try{if(configured){await setDoc(doc(db,'dreamVotes',pollKey()+'_'+user.uid),{qid:pollKey(),uid:user.uid,choice,createdAt:serverTimestamp()});}else{let v=getLocal();v[pollKey()]=[{uid:localUser,choice}];localStorage.setItem('dream_demo_votes',JSON.stringify(v));localLoad()}}catch(e){alert('投票失敗：'+e.message)}}
function watchVotes(){unsubscribeVotes();if(!configured){localLoad();return}unsubscribeVotes=onSnapshot(collection(db,'dreamVotes'),s=>{ballots=s.docs.map(d=>d.data()).filter(b=>b.qid===pollKey());display()},e=>$('message').textContent='無法讀取投票資料：'+e.message)}
function changeIndex(n){index=Math.max(0,Math.min(items.length-1,n));showResults=false;if(configured)watchVotes();else{localStorage.setItem('dream_demo_index',index);localLoad()}}
async function move(n){if(configured){if(!isTeacher)return;await setDoc(doc(db,'dreamSessions','current'),{index:Math.max(0,Math.min(items.length-1,n))})}else changeIndex(n)}
$('prev').onclick=()=>move(index-1);$('next').onclick=()=>move(index+1);$('resultsBtn').onclick=()=>{showResults=!showResults;display()};$('reset').onclick=async()=>{if(!confirm('確定清除所有題目的投票嗎？此動作不能復原。'))return;try{if(configured){let snap=await getDocs(collection(db,'dreamVotes'));for(let j=0;j<snap.docs.length;j+=400){let batch=writeBatch(db);snap.docs.slice(j,j+400).forEach(d=>batch.delete(d.ref));await batch.commit()}$('teacherMsg').textContent='投票已清除'}else{localStorage.removeItem('dream_demo_votes');localLoad()}}catch(e){alert(e.message)}};
if(configured){const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);$('state').textContent='Firebase 即時連線';$('login').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert('登入失敗：'+e.message));$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,u=>{user=u;isTeacher=!!(u&&teacherEmail&&u.email.toLowerCase()===teacherEmail.toLowerCase());$('login').classList.toggle('hidden',!!u);$('logout').classList.toggle('hidden',!u);$('state').textContent=u?'登入：'+u.email:'請登入 Google';unsubscribeSession();unsubscribeVotes();if(u){unsubscribeSession=onSnapshot(doc(db,'dreamSessions','current'),snap=>{let n=snap.exists()?snap.data().index:0;if(n!==index)changeIndex(n);else watchVotes()},e=>$('message').textContent='無法同步題目：'+e.message)}else{ballots=[];display()}})}else{$('state').textContent='本機預覽（未連線）';$('login').classList.add('hidden');$('teacher').classList.remove('hidden');isTeacher=true;localLoad();$('privacy').textContent='目前為本機示範模式，不會同步其他裝置。請依 README 設定 Firebase 以啟用全班即時投票。'}
</script></body></html>
